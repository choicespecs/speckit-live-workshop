<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#dde8f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1d6fbc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1d6fbc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: matches the deck's own Ocean Slate Light palette, not the
       generic dark YouTube-thumbnail default, so it doesn't look disconnected
       from a light-themed deck. -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGradient)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="10" height="720" fill="#1d6fbc"/>

  <!-- Title -->
  <text x="640" y="300" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="800" letter-spacing="-4" fill="#0c1b35">Spec-Driven</text>
  <text x="640" y="440" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="800" letter-spacing="-4" fill="#1d6fbc">Development</text>

  <!-- Bottom category label -->
  <text x="640" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="6" fill="#4a6a8a">WORKFLOW</text>
</svg>